<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم تغيير وجهتك! | هاكثون العدالة النيابي</title>
<meta name="description" content="تعددت الطرق، والوجهة واحدة: ابتكار مستقبل العدالة">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" dir="ltr"></div>

<header id="topbar" hidden>
  <div class="prog"><span id="progText">0 من 3</span><div class="bar"><i id="progBar"></i></div></div>
  <button id="muteBtn" class="chip" aria-label="كتم الصوت">🔊</button>
</header>

<div id="toast" role="status" aria-live="polite"></div>

<div id="tools" hidden>
  <button id="recenterBtn" class="fab" aria-label="إعادة تمركز الخريطة">🎯</button>
  <button id="toggleBtn" class="fab" aria-label="إظهار أو إخفاء الوجهات">📍</button>
</div>

<section id="start" class="sheet open">
  <img id="clubLogo" class="logo" alt="شعار نادي العدالة النيابي">
  <p class="small">نادي العدالة النيابي · كلية الحقوق والعلوم السياسية</p>
  <div class="pinAnim">📍</div>
  <h1 id="startLine"></h1>
  <button id="startBtn" class="btn"></button>
</section>

<section id="card" class="sheet" aria-live="polite">
  <div class="ico" id="cardIcon"></div>
  <h2 id="cardTitle"></h2>
  <p class="small" id="cardPlace"></p>
  <p id="cardText"></p>
  <button id="discoverBtn" class="btn">اكتشف الوجهة</button>
  <button id="closeBtn" class="link">إغلاق</button>
</section>

<section id="fallback" hidden>
  <p id="fbMsg"></p>
  <div id="fbList"></div>
</section>

<section id="final" class="full">
  <div class="finalIn">
    <div class="logos"><img id="fClub" alt="شعار النادي"><img id="fHack" alt="شعار الهاكثون"></div>
    <h1 class="big" id="fTitle"></h1>
    <p class="next" id="fNext"></p>
    <h2 id="fName"></h2>
    <p id="fLine"></p>
    <a id="regBtn" class="btn" target="_blank" rel="noopener"></a>
    <p class="slogan" id="fSlogan"></p>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
